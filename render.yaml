# Render.com Blueprint — botni bir tugma bilan deploy qilish uchun.
# Render dashboard'ga ulanadi: New -> Blueprint -> bu repozitoriyani tanlang.
#
# TELEGRAM_BOT_TOKEN hech qachon git'ga yozilmaydi: `sync: false` — uni
# Render dashboard'ga qo'lda kiritish kerak (Environment -> Add Environment Variable).
#
# Eslatma: Render web service majburiy ravishda `PORT` ga ulanishi kerak.
# Bot `PORT` da o'z HTTP serverini qo'yadi (POST /webhook, GET /health) —
# healthCheckPath esa shu serverga ishora qiladi.
services:
  - type: web
    name: mahsulot-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -u bot.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_URL
        value: https://mahsulot-bot.onrender.com
      - key: WEBHOOK_PATH
        value: /webhook
      # Render free tier 15 daqiqa faollikdan keyin uxlaydi — keep-alive yoqmaydi
      - key: KEEPALIVE_INTERVAL
        value: "300"
      # Loglar to'g'ri ko'rinishi uchun
      - key: PYTHONUNBUFFERED
        value: "1"
      # Korxonaning vaqt zonasi (Render serveri UTC'da ishlaydi)
      - key: TZ
        value: Asia/Tashkent
      - key: LOG_LEVEL
        value: INFO
